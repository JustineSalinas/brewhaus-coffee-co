        - heading "Our Story" [level=1] [ref=f4e15]
        - paragraph [ref=f4e16]: The people and the passion behind every bag.
      - paragraph [ref=f4e18]: "Brewhaus Coffee Co. started as a weekend hobby in a cramped apartment kitchen, where a secondhand roaster and a shared obsession with chasing the perfect cup turned into something bigger. After years of bringing home-roasted bags to friends and family — and running out faster than we could roast — we realized people weren't just being polite. They genuinely craved coffee that tasted alive: traceable to a farm, roasted in small batches, and never left to go stale on a shelf. That idea became our mission. We founded Brewhaus to close the gap between farmer and cup, working directly with growers we trust, roasting in batches small enough to taste the difference, and shipping every order within 48 hours of roasting so you get coffee at its peak, not its memory."
